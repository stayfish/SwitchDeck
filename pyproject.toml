[project]
name = "switchdeck"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "pynput>=1.8.1",
    "pystray>=0.19.5",
]

[project.scripts]
switchdeck = "switchdeck.cli:main"

[project.gui-scripts]
switchdeck-agent = "switchdeck.launcher:main"

[dependency-groups]
build = ["pyinstaller>=6.16.0"]

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"
